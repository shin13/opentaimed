name: publish

# Publish taiwan-fda-mcp to PyPI on a version tag (e.g. `v0.2.0`).
#
# Uses PyPI Trusted Publishing (OIDC): no API token is stored in the repo or
# in secrets. PyPI verifies the workflow's short-lived OIDC identity instead.
# One-time setup on PyPI: add a Trusted Publisher for project `taiwan-fda-mcp`
# pointing at owner `shin13`, repo `opentaimed`, workflow `publish.yml`,
# environment `pypi`.
#
# Hardening note: every `uses:` below is pinned to a full commit SHA (with a
# trailing `# vX.Y.Z` for readability) — especially the publish action, which
# carries the OIDC identity. Dependabot's `github-actions` ecosystem
# (.github/dependabot.yml) keeps these SHAs current.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build distributions
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: taiwan-fda-mcp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: taiwan-fda-mcp/uv.lock

      - name: Set up Python 3.13
        run: uv python install 3.13

      - name: Build sdist + wheel
        run: uv build

      - name: Upload distributions artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: taiwan-fda-mcp/dist/

  publish:
    name: publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    # The `pypi` environment is the trust anchor for OIDC publishing and the
    # natural place to attach a manual-approval protection rule later.
    environment:
      name: pypi
      url: https://pypi.org/project/taiwan-fda-mcp/
    permissions:
      # Mint the short-lived OIDC token Trusted Publishing exchanges for an
      # upload credential. No long-lived token is stored anywhere.
      id-token: write
    steps:
      - name: Download distributions artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  release:
    name: create GitHub Release
    # Runs only after PyPI accepted the upload. Publishing is manually gated on
    # the `pypi` environment, and RELEASING.md documents abandoning a release by
    # deleting the tag — creating the Release earlier would risk announcing a
    # version that never shipped, pointing at a tag that no longer exists.
    needs: publish
    # `publish.yml` also accepts workflow_dispatch, where github.ref is a branch
    # and there is no version to release.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      # Deliberately a separate job: this is the only `contents: write` in the
      # workflow, and it must not share a job with the `id-token: write` OIDC
      # identity that Trusted Publishing exchanges for a PyPI credential.
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Extract this version's CHANGELOG section
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          # Literal match on the opening heading (index, not a regex) so the
          # dots in a version number cannot act as wildcards; the closing
          # condition is a genuine pattern — any next version heading ends it.
          awk -v ver="$version" \
            'index($0, "## [" ver "]") == 1 {f=1; next} /^## \[/ {f=0} f' \
            CHANGELOG.md > release-notes.md
          # A missing or renamed heading yields a blank file. Fail loudly rather
          # than publishing an empty Release.
          grep -q '[^[:space:]]' release-notes.md \
            || { echo "::error::No CHANGELOG section found for [$version]"; exit 1; }

      - name: Create the Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # `--latest` is correct while 0.x moves forward linearly. Revisit if a
        # hotfix for an older minor is ever tagged after a newer release.
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --notes-file release-notes.md \
            --latest \
            --verify-tag
