name: smoke

# Daily live smoke test against the real TFDA APIs. FDA contract drift (a
# renamed field, a dropped section, a moved license number) propagates into LLM
# citations within hours, so this runs daily rather than weekly. The `smoke`
# job reads code + calls the public FDA APIs; only the `alert` job may write
# issues.

on:
  schedule:
    - cron: "0 18 * * *"   # 18:00 UTC daily = 02:00 Asia/Taipei
  workflow_dispatch:
    inputs:
      simulate_failure:
        description: "Force the smoke job to fail (to validate the alert path)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  smoke:
    name: live smoke (-m smoke)
    runs-on: ubuntu-latest
    # A healthy run is ~2 min. When mcp.fda.gov.tw is unreachable (common in the
    # ~02:00 Asia/Taipei maintenance window) each insert fetch burns its full
    # 120s x 3-retry budget, so an untimed run has hung ~43 min before failing.
    # Cap it: fail fast on a sustained upstream outage instead of idling a runner.
    timeout-minutes: 12
    defaults:
      run:
        working-directory: taiwan-fda-mcp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
          cache-dependency-glob: taiwan-fda-mcp/uv.lock

      - name: Set up Python 3.13
        run: uv python install 3.13

      - name: Sync dependencies
        run: uv sync --frozen

      # Diagnostic only, never fails the job. The NHI probe drops (ReadError) from
      # GitHub runners while the same host answers from Taiwan (#113). This logs
      # where the connection breaks, whether the User-Agent matters, and the
      # runner's public IP.
      - name: NHI reachability diagnostic
        continue-on-error: true
        env:
          URL: https://info.nhi.gov.tw/api/iode0010/v1/rest/dataset/A21030000I-E41001
        run: |
          # The runner's public IP changes per run. Compare it across passing and
          # failing nights to see whether only some IP ranges are reset. Forced to
          # IPv4, because the NHI host has no IPv6 address.
          echo "--- runner public IPv4: $(curl -4 -sS --max-time 10 https://ifconfig.me/ip || echo unknown)"
          fmt='http=%{http_code} bytes=%{size_download} dns=%{time_namelookup}s tcp=%{time_connect}s tls=%{time_appconnect}s first_byte=%{time_starttransfer}s total=%{time_total}s\n'
          for ua in "curl/default" "python-httpx/0.28.1"; do
            for i in 1 2 3; do
              echo "--- UA=$ua attempt $i"
              if [ "$ua" = "curl/default" ]; then
                curl -sS -o /dev/null --max-time 20 -w "$fmt" "$URL" || echo "curl exit=$?"
              else
                curl -sS -o /dev/null --max-time 20 -A "$ua" -w "$fmt" "$URL" || echo "curl exit=$?"
              fi
            done
          done
          echo "--- verbose (one call)"
          curl -v -o /dev/null --max-time 20 "$URL" 2>&1 | grep -E '^\*|^> [A-Z]|^< HTTP' || true

      - name: Live smoke tests
        env:
          SIMULATE_FAILURE: ${{ inputs.simulate_failure }}
        run: |
          if [ "$SIMULATE_FAILURE" = "true" ]; then
            echo "simulate_failure=true -> forcing failure to validate the alert path"
            exit 1
          fi
          uv run pytest -m smoke -v

  alert:
    name: file failure issue
    needs: smoke
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: Dedup-file a smoke-failure issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          LABEL: smoke-failure
          DESC: "Daily TFDA live smoke test failed"
          TITLE: "Daily TFDA smoke test failing"
          BODY: "The daily live smoke test (`pytest -m smoke`) failed. **Read the failing test's error before re-running** — for the NHI probe the error names the fix itself, so guessing is no longer necessary.\n\n**`test_smoke_nhi_probe_is_reachable`** raises `DatasetFetchError` carrying one of four RCodes:\n\n| RCode | Meaning | Fix |\n|---|---|---|\n| `DATASET_FETCH_FAILED` | unreachable after 3 attempts | upstream availability — confirm the host, then close if it was a blip |\n| `DATASET_HTTP_STATUS` | a response, non-2xx (e.g. 404) | the endpoint moved — re-verify the URL and dataset ID |\n| `DATASET_EMPTY` | 2xx carrying no dataset | investigate whether the dataset ID was retired |\n| `DATASET_PARSE_FAILED` | a dataset, but a field moved | upstream schema drift — the parsing logic must follow it |\n\nA plain `AssertionError` there means reachable and parsed, but an implausible row count — investigate before trusting NHI answers.\n\n**The TFDA tests** (`mcp.fda.gov.tw` / `data.fda.gov.tw`) do not yet carry this taxonomy. For those, the old triage still applies: a transient outage is common in the ~02:00 Asia/Taipei window, so re-run the workflow — if it passes it was a blip; if it fails again quickly on an assertion, it is contract drift (a renamed field, a dropped section, a moved license), so investigate before trusting insert citations."
        run: |
          set -euo pipefail
          gh label create "$LABEL" -R "$REPO" --color B60205 --description "$DESC" --force
          existing=$(gh issue list -R "$REPO" --label "$LABEL" --state open --json number -q '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" -R "$REPO" --body "Failed again on $(date -u +%Y-%m-%d). Run: $RUN_URL"
          else
            gh issue create -R "$REPO" --label "$LABEL" --title "$TITLE" --body "$BODY"$'\n\n'"Run: $RUN_URL"
          fi
